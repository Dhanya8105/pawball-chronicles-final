# Local dev stack: Mongo + Redis + apps/api + apps/web.
#
# Computer vision now runs inside apps/api (modules/capture/cv.service.ts,
# a direct Gemini REST call) — there is no separate AI service any more.
#
# Build context for web/api is the repo root (../..), not their own app
# folders — apps/api/Dockerfile and apps/web/Dockerfile copy from the
# workspace root (package.json, packages/shared-types). This compose file
# lives at infra/docker/, so paths below are relative to that location.

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports: ["4000:4000"]
    depends_on: [mongo, redis]
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - MONGO_URI=mongodb://mongo:27017/pawball
      - REDIS_URL=redis://redis:6379
      # CV: direct Gemini REST call. Without a key -> labelled mock CV result.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-lite-latest}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1

volumes:
  mongo-data:
